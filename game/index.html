<style>

#kL{left:1.2rem;bottom:1.2rem}#kR{left:8.4rem;bottom:1.2rem}#kE{right:1.4rem;bottom:1.2rem;width:7.6rem;height:7.6rem;background:#0f5a58aa;border-color:#4cc9c0}

.fat{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#000 130%);opacity:0}


#joy{position:absolute;left:.6rem;bottom:.4rem;width:15rem;height:15rem;display:none;pointer-events:auto;touch-action:none;border-radius:50%}

.td #joy{display:block}.td #kL,.td #kR,.td #kU,.td #kC{display:none}
#kZ{display:none}.td #kZ{display:flex;right:2.2rem;bottom:9.8rem;width:5.6rem;height:5.6rem;font-size:2.2rem}
.td #kX{right:10.4rem;bottom:1.4rem;width:7.2rem;height:7.2rem}.td #kE{right:1.4rem;bottom:1.2rem}

#screen.tr{background:transparent}

.logo{font-family:ui-monospace,"DejaVu Sans Mono",monospace;font-weight:900;font-size:7.6rem;line-height:1;letter-spacing:.35rem;color:#eaf4f8;text-shadow:.35rem .35rem 0 #7a1814,-.15rem 0 0 #4cc9c0,0 0 2.4rem #e0453aaa;margin-top:1.2rem;white-space:nowrap}
.logo span{display:inline-block;animation:lf 5s steps(1) infinite}

.sub{color:#e5a93b;font-family:ui-monospace,"DejaVu Sans Mono",monospace;letter-spacing:.5rem;font-size:1.5rem;margin:.6rem 0 0 .6rem;text-shadow:0 0 .8rem #000}
.mn{display:flex;flex-direction:column;align-items:flex-start;margin-top:2.6rem;gap:.35rem}.mn .pbtn{min-width:21rem;text-align:left;margin:.25rem .3rem}

.mn2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;max-width:46rem}.mn2 .pbtn{text-align:left}

.hw{max-width:62rem}.hw li{font-size:1.3rem}
.card{image-rendering:pixelated}

.pxb{background:#09131b;box-shadow:0 -.3rem 0 #3a8f8a,0 .3rem 0 #3a8f8a,-.3rem 0 0 #3a8f8a,.3rem 0 0 #3a8f8a,0 0 0 .3rem #05090d}

.pbtn:active{transform:translateY(.15rem)}.pbtn.pri{background:#0f5a58;box-shadow:0 -.2rem #4cc9c0,0 .2rem #4cc9c0,-.2rem 0 #4cc9c0,.2rem 0 #4cc9c0;color:#fff}.pbtn.red{background:#5a1a16;box-shadow:0 -.2rem #e0453a,0 .2rem #e0453a,-.2rem 0 #e0453a,.2rem 0 #e0453a}

.rs{padding:.9rem 1.5rem;font-family:ui-monospace,"Roboto Mono","DejaVu Sans Mono",monospace;height:100%;background:#09131bf4}
.rs-k{color:#e5a93b;font-size:1.3rem;letter-spacing:.12rem;margin-bottom:.5rem}.rs-main{display:flex;gap:2rem;align-items:center}

.tl{list-style:none;padding:0;margin:0}.tl li{display:flex;gap:1.2rem;align-items:flex-start;margin-bottom:.85rem;font-size:1.25rem;line-height:1.3;color:#cfe3ee}
